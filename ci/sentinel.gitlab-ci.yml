---
# Sentinel is built and promoted by GitLab CI. GitHub is a read-only source mirror;
# this pipeline mirrors immutable OCI artifacts to GHCR after all security gates pass.

.sentinel-rules:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^chore\(sentinel\): promote/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.cosign-shell:
  image: golang:1.26.9-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c
  before_script:
    - source ci/dependencies.env
    - cosign_url="https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
    - >-
      curl --fail --location --silent --show-error --retry 5 --retry-all-errors
      --output /tmp/cosign "$cosign_url"
    - printf '%s  %s\n' "$COSIGN_BINARY_SHA256" /tmp/cosign | sha256sum --check --strict
    - install --mode 0755 /tmp/cosign /usr/local/bin/cosign
    - cosign version

lint:sentinel:
  extends: .sentinel-rules
  stage: lint
  image: golang:1.26.9-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c
  script:
    - make -C apps/sentinel lint

test:sentinel:
  extends: .sentinel-rules
  stage: test
  image: golang:1.26.9-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c
  script:
    - make -C apps/sentinel test
  coverage: '/coverage: \d+\.\d+% of statements/'

test:sentinel-integration:
  extends: .sentinel-rules
  stage: test
  image: golang:1.26.9-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c
  services:
    - name: >-
        docker.io/library/postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
      alias: postgres
  variables:
    POSTGRES_DB: sentinel
    POSTGRES_USER: sentinel
    POSTGRES_PASSWORD: integration-only
    DATABASE_URL: postgres://sentinel:integration-only@postgres:5432/sentinel?sslmode=disable
  script:
    - cd apps/sentinel
    - go test -race -tags=integration ./internal/database

build:sentinel-images:
  stage: build
  image: docker.io/library/docker:29.1.3-cli@sha256:4fa0ee1f3a7e4354c4ea34558b6d4ee32859baf4973d4c8ccc8e7fe3dd730c04
  services:
    - name: docker.io/library/docker:29.1.3-dind@sha256:173f284a4299164772a90f52b373e73e087583c0963f1334c9995f190ef6f3f5
      alias: docker
      command:
        - --tls=false
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --driver docker-container --use --name sentinel-builder
    - docker buildx inspect --bootstrap
  script:
    - api_ref="${CI_REGISTRY_IMAGE}/homelab-sentinel-api:${CI_COMMIT_SHA}"
    - worker_ref="${CI_REGISTRY_IMAGE}/homelab-sentinel-worker:${CI_COMMIT_SHA}"
    - >-
      docker buildx build --platform linux/amd64,linux/arm64 --provenance=false
      --sbom=false --file apps/sentinel/Dockerfile.api --tag "$api_ref"
      --push apps/sentinel
    - >-
      docker buildx build --platform linux/amd64,linux/arm64 --provenance=false
      --sbom=false --file apps/sentinel/Dockerfile.worker --tag "$worker_ref"
      --push apps/sentinel
    - docker buildx imagetools inspect "$api_ref" | awk '$1 == "Digest:" {print $2; exit}' > sentinel-api.digest
    - docker buildx imagetools inspect "$worker_ref" | awk '$1 == "Digest:" {print $2; exit}' > sentinel-worker.digest
    - grep -Eq '^sha256:[a-f0-9]{64}$' sentinel-api.digest
    - grep -Eq '^sha256:[a-f0-9]{64}$' sentinel-worker.digest
  artifacts:
    paths:
      - sentinel-api.digest
      - sentinel-worker.digest
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^chore\(sentinel\): promote/'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

package:sentinel-deployment:
  stage: build
  image: golang:1.26.9-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c
  script:
    - mkdir -p ci-output
    - >-
      tar --create --gzip --file ci-output/sentinel-deploy.tgz
      apps/sentinel/base apps/sentinel/overlays apps/sentinel/README.md
      apps/sentinel/dependencies.env
      scripts/promote-sentinel-images.sh
    - sha256sum ci-output/sentinel-deploy.tgz > ci-output/sentinel-deploy.tgz.sha256
  artifacts:
    paths:
      - ci-output/sentinel-deploy.tgz
      - ci-output/sentinel-deploy.tgz.sha256
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^chore\(sentinel\): promote/'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

security:sbom-sentinel:
  stage: security
  image:
    name: ghcr.io/anchore/syft:v1.54.0-debug@sha256:ecb98634988418285b79eacf0239f6c0d06af3a45e9b92e9ec121a612b6ad376
    entrypoint:
      - ""
  needs:
    - job: build:sentinel-images
      artifacts: true
  variables:
    SYFT_REGISTRY_AUTH_USERNAME: $CI_REGISTRY_USER
    SYFT_REGISTRY_AUTH_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - api_ref="${CI_REGISTRY_IMAGE}/homelab-sentinel-api@$(cat sentinel-api.digest)"
    - worker_ref="${CI_REGISTRY_IMAGE}/homelab-sentinel-worker@$(cat sentinel-worker.digest)"
    - /syft "$api_ref" --output spdx-json=sentinel-api-sbom.spdx.json
    - /syft "$worker_ref" --output spdx-json=sentinel-worker-sbom.spdx.json
  artifacts:
    paths:
      - sentinel-api-sbom.spdx.json
      - sentinel-worker-sbom.spdx.json
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

security:trivy-sentinel:
  stage: security
  image:
    name: mirror.gcr.io/aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    entrypoint:
      - ""
  needs:
    - job: build:sentinel-images
      artifacts: true
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - api_ref="${CI_REGISTRY_IMAGE}/homelab-sentinel-api@$(cat sentinel-api.digest)"
    - worker_ref="${CI_REGISTRY_IMAGE}/homelab-sentinel-worker@$(cat sentinel-worker.digest)"
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$api_ref"
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$worker_ref"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

sign:sentinel-gitlab:
  extends: .cosign-shell
  stage: sign
  needs:
    - job: build:sentinel-images
      artifacts: true
    - job: security:sbom-sentinel
      artifacts: true
    - job: security:trivy-sentinel
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - cosign login --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - api_ref="${CI_REGISTRY_IMAGE}/homelab-sentinel-api@$(cat sentinel-api.digest)"
    - worker_ref="${CI_REGISTRY_IMAGE}/homelab-sentinel-worker@$(cat sentinel-worker.digest)"
    - cosign sign --yes --identity-token "$SIGSTORE_ID_TOKEN" "$api_ref"
    - >-
      cosign attest --yes --identity-token "$SIGSTORE_ID_TOKEN"
      --predicate sentinel-api-sbom.spdx.json --type spdx "$api_ref"
    - cosign sign --yes --identity-token "$SIGSTORE_ID_TOKEN" "$worker_ref"
    - >-
      cosign attest --yes --identity-token "$SIGSTORE_ID_TOKEN"
      --predicate sentinel-worker-sbom.spdx.json --type spdx "$worker_ref"
    - >-
      cosign verify
      --certificate-identity
      "https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}//.gitlab-ci.yml@refs/heads/${CI_DEFAULT_BRANCH}"
      --certificate-oidc-issuer "$CI_SERVER_URL" "$api_ref"
    - >-
      cosign verify
      --certificate-identity
      "https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}//.gitlab-ci.yml@refs/heads/${CI_DEFAULT_BRANCH}"
      --certificate-oidc-issuer "$CI_SERVER_URL" "$worker_ref"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.promote-sentinel:
  image: golang:1.26.9-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c
  needs:
    - job: build:sentinel-images
      artifacts: true
    - job: sign:sentinel-gitlab
  before_script:
    - test -n "$GITLAB_PROMOTION_TOKEN"
    - git config user.name "Sentinel promotion bot"
    - git config user.email "sentinel-promotion@users.noreply.gitlab.com"
    - git remote set-url origin "https://oauth2:${GITLAB_PROMOTION_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - git checkout -B "$CI_DEFAULT_BRANCH" "origin/$CI_DEFAULT_BRANCH"
  script:
    - api_digest="$(cat sentinel-api.digest)"
    - worker_digest="$(cat sentinel-worker.digest)"
    - scripts/promote-sentinel-images.sh "$PROMOTION_ENVIRONMENT" "$api_digest" "$worker_digest"
    - git add "apps/sentinel/overlays/${PROMOTION_ENVIRONMENT}/image-lock.env"
    - git diff --cached --quiet && exit 0
    - 'git commit -m "chore(sentinel): promote ${PROMOTION_ENVIRONMENT} images [skip ci]"'
    - git push origin "HEAD:${CI_DEFAULT_BRANCH}"

promote:sentinel-staging:
  extends: .promote-sentinel
  stage: promote
  variables:
    PROMOTION_ENVIRONMENT: staging
  environment:
    name: sentinel/staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

promote:sentinel-production:
  extends: .promote-sentinel
  stage: promote
  needs:
    - job: build:sentinel-images
      artifacts: true
    - job: sign:sentinel-gitlab
    - job: promote:sentinel-staging
  variables:
    PROMOTION_ENVIRONMENT: prod
  environment:
    name: sentinel/production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false

mirror:sentinel-ghcr:
  stage: mirror
  image:
    name: ghcr.io/oras-project/oras:v1.3.4@sha256:f7bc056d54d97baa399414ed5048ecc67c3371b750d4bbce1d871827a5758179
    entrypoint:
      - ""
  needs:
    - job: build:sentinel-images
      artifacts: true
    - job: package:sentinel-deployment
      artifacts: true
    - job: sign:sentinel-gitlab
  before_script:
    - test -n "$GHCR_NAMESPACE"
    - test -n "$GHCR_USERNAME"
    - test -n "$GHCR_TOKEN"
    - oras login --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - oras login --username "$GHCR_USERNAME" --password "$GHCR_TOKEN" ghcr.io
  script:
    - api_source="${CI_REGISTRY_IMAGE}/homelab-sentinel-api@$(cat sentinel-api.digest)"
    - worker_source="${CI_REGISTRY_IMAGE}/homelab-sentinel-worker@$(cat sentinel-worker.digest)"
    - api_target="ghcr.io/${GHCR_NAMESPACE}/homelab-sentinel-api:${CI_COMMIT_SHA}"
    - worker_target="ghcr.io/${GHCR_NAMESPACE}/homelab-sentinel-worker:${CI_COMMIT_SHA}"
    - deploy_target="ghcr.io/${GHCR_NAMESPACE}/homelab-sentinel-deploy:${CI_COMMIT_SHA}"
    - oras copy --recursive "$api_source" "$api_target"
    - oras copy --recursive "$worker_source" "$worker_target"
    - >-
      oras push "$deploy_target"
      --artifact-type application/vnd.anouar.homelab.sentinel.deployment.v1+tar
      ci-output/sentinel-deploy.tgz:application/vnd.anouar.homelab.sentinel.deployment.layer.v1.tar+gzip
      ci-output/sentinel-deploy.tgz.sha256:text/plain
    - printf '%s@%s\n' "${api_target%:*}" "$(oras resolve "$api_target")" > ghcr-api.ref
    - printf '%s@%s\n' "${worker_target%:*}" "$(oras resolve "$worker_target")" > ghcr-worker.ref
    - printf '%s@%s\n' "${deploy_target%:*}" "$(oras resolve "$deploy_target")" > ghcr-deploy.ref
  artifacts:
    paths:
      - ghcr-api.ref
      - ghcr-worker.ref
      - ghcr-deploy.ref
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

sign:sentinel-ghcr:
  extends: .cosign-shell
  stage: mirror
  needs:
    - job: mirror:sentinel-ghcr
      artifacts: true
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - cosign login --username "$GHCR_USERNAME" --password "$GHCR_TOKEN" ghcr.io
    - cosign sign --yes --identity-token "$SIGSTORE_ID_TOKEN" "$(cat ghcr-api.ref)"
    - cosign sign --yes --identity-token "$SIGSTORE_ID_TOKEN" "$(cat ghcr-worker.ref)"
    - cosign sign --yes --identity-token "$SIGSTORE_ID_TOKEN" "$(cat ghcr-deploy.ref)"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
