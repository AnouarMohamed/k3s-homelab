---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinel-database-owner
  labels:
    app.kubernetes.io/name: sentinel-database-owner
    app.kubernetes.io/component: database-credentials
    app.kubernetes.io/part-of: homelab-sentinel
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: sentinel-database-owner
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        username: '{{ .username }}'
        password: '{{ .password }}'
        DATABASE_URL: 'postgres://{{ .username }}:{{ .password }}@sentinel-database-rw:5432/sentinel?sslmode=require'
  data:
    - secretKey: username
      remoteRef:
        key: apps-sentinel/prod/database
        property: username
    - secretKey: password
      remoteRef:
        key: apps-sentinel/prod/database
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinel-s3-credentials
  labels:
    app.kubernetes.io/name: sentinel-s3-credentials
    app.kubernetes.io/component: backup-credentials
    app.kubernetes.io/part-of: homelab-sentinel
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: sentinel-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: apps-sentinel/prod/s3
        property: access-key-id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: apps-sentinel/prod/s3
        property: secret-access-key
