---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  labels:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/component: diagnostic-endpoint
    app.kubernetes.io/part-of: homelab-applications
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: gateways
      sectionName: tunnel-http
  hostnames:
    - whoami.${CONFIG_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: whoami
          port: 80
          weight: 1
