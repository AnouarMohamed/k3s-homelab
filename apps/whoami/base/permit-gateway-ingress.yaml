---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: whoami-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: whoami
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: '80'
              protocol: TCP
