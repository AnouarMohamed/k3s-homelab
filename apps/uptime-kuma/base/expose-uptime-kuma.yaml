---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  labels: {'app.kubernetes.io/name': uptime-kuma, 'app.kubernetes.io/component': application, 'app.kubernetes.io/part-of': uptime-kuma}
spec:
  selector: {'app.kubernetes.io/name': uptime-kuma}
  ports: [{name: http, port: 3001, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uptime-kuma
  labels: {'app.kubernetes.io/name': uptime-kuma, 'app.kubernetes.io/component': internal-route, 'app.kubernetes.io/part-of': uptime-kuma}
spec:
  parentRefs: [{name: internal, namespace: gateways, sectionName: https}]
  hostnames: ['uptime.${CONFIG_DOMAIN}']
  rules:
    - backendRefs: [{name: uptime-kuma, port: 3001}]
