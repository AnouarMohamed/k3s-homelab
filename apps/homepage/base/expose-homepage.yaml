---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  labels: {'app.kubernetes.io/name': homepage, 'app.kubernetes.io/component': application, 'app.kubernetes.io/part-of': homepage}
spec:
  selector: {'app.kubernetes.io/name': homepage}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  labels: {'app.kubernetes.io/name': homepage, 'app.kubernetes.io/component': internal-route, 'app.kubernetes.io/part-of': homepage}
spec:
  parentRefs: [{name: internal, namespace: gateways, sectionName: https}]
  hostnames: ['homepage.${CONFIG_DOMAIN}']
  rules:
    - backendRefs: [{name: homepage, port: 3000}]
