---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  labels: {'app.kubernetes.io/name': homepage, 'app.kubernetes.io/component': application, 'app.kubernetes.io/part-of': homepage}
spec:
  replicas: 2
  selector: {matchLabels: {'app.kubernetes.io/name': homepage}}
  template:
    metadata:
      labels: {'app.kubernetes.io/name': homepage, 'app.kubernetes.io/component': application, 'app.kubernetes.io/part-of': homepage}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {'app.kubernetes.io/name': homepage}}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {'app.kubernetes.io/name': homepage}
      containers:
        - name: homepage
          image: ${HOMEPAGE_IMAGE}
          imagePullPolicy: IfNotPresent
          command: [node, server.js]
          workingDir: /app
          env:
            - {name: HOMEPAGE_ALLOWED_HOSTS, value: 'homepage.${CONFIG_DOMAIN}'}
          ports: [{name: http, containerPort: 3000, protocol: TCP}]
          readinessProbe: {httpGet: {path: /api/healthcheck, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/healthcheck, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: configuration, mountPath: /app/config, readOnly: true}
            - {name: cache, mountPath: /app/.next/cache}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: configuration
          configMap: {name: homepage-configuration}
        - name: cache
          emptyDir: {}
        - name: temporary
          emptyDir: {}
