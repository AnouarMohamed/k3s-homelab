---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  labels: {'app.kubernetes.io/name': vaultwarden, 'app.kubernetes.io/component': application, 'app.kubernetes.io/part-of': vaultwarden}
spec:
  selector: {'app.kubernetes.io/name': vaultwarden}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden
  labels: {'app.kubernetes.io/name': vaultwarden, 'app.kubernetes.io/component': internal-route, 'app.kubernetes.io/part-of': vaultwarden}
spec:
  parentRefs: [{name: internal, namespace: gateways, sectionName: https}]
  hostnames: ['vaultwarden.${CONFIG_DOMAIN}']
  rules:
    - backendRefs: [{name: vaultwarden, port: 8080}]
