---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-runtime
  labels: {'app.kubernetes.io/name': vaultwarden-runtime, 'app.kubernetes.io/component': runtime-credentials, 'app.kubernetes.io/part-of': vaultwarden}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: vaultwarden-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        username: '{{ .username }}'
        password: '{{ .password }}'
        DATABASE_URL: 'postgresql://{{ .username }}:{{ .password }}@vaultwarden-database-rw:5432/vaultwarden?sslmode=require'
  data:
    - secretKey: username
      remoteRef: {key: apps-vaultwarden/runtime, property: database-username}
    - secretKey: password
      remoteRef: {key: apps-vaultwarden/runtime, property: database-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-s3-credentials
  labels: {'app.kubernetes.io/name': vaultwarden-s3-credentials, 'app.kubernetes.io/component': backup-credentials, 'app.kubernetes.io/part-of': vaultwarden}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: vaultwarden-s3-credentials, creationPolicy: Owner, deletionPolicy: Retain}
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: apps-vaultwarden/s3, property: access-key-id}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: apps-vaultwarden/s3, property: secret-access-key}
