---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: vaultwarden-backups
  labels:
    app.kubernetes.io/name: vaultwarden-backups
    app.kubernetes.io/component: database-backup
    app.kubernetes.io/part-of: vaultwarden
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://${CONFIG_S3_BUCKET}/vaultwarden
    endpointURL: ${CONFIG_S3_ENDPOINT}
    s3Credentials:
      accessKeyId:
        name: vaultwarden-s3-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: vaultwarden-s3-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
      jobs: 2
  instanceSidecarConfiguration:
    retentionPolicyIntervalSeconds: 1800
    resources:
      requests:
        cpu: 30m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-auth
  labels:
    app.kubernetes.io/name: vaultwarden-openbao-auth
    app.kubernetes.io/component: authentication
    app.kubernetes.io/part-of: vaultwarden
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mint-openbao-auth-token
  labels:
    app.kubernetes.io/name: vaultwarden-openbao-auth
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: vaultwarden
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - openbao-auth
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-external-secrets-to-mint-openbao-token
  labels:
    app.kubernetes.io/name: vaultwarden-openbao-auth
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: vaultwarden
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mint-openbao-auth-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  labels:
    app.kubernetes.io/name: vaultwarden-openbao-store
    app.kubernetes.io/component: secret-store
    app.kubernetes.io/part-of: vaultwarden
spec:
  provider:
    vault:
      server: https://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        namespace: openbao
        name: openbao-server-tls
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: runtime-apps-vaultwarden
          serviceAccountRef:
            name: openbao-auth
            audiences:
              - openbao
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vaultwarden-database
  labels:
    app.kubernetes.io/name: vaultwarden-database
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: vaultwarden
spec:
  instances: 3
  imageName: ${CNPG_POSTGRES_IMAGE}
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: vaultwarden-database
      app.kubernetes.io/component: database
      app.kubernetes.io/part-of: vaultwarden
  bootstrap:
    initdb:
      database: vaultwarden
      owner: vaultwarden
      secret:
        name: vaultwarden-database-owner
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  storage:
    size: 10Gi
    storageClass: longhorn
  walStorage:
    size: 2Gi
    storageClass: longhorn
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: vaultwarden-backups
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-database-owner
  labels:
    app.kubernetes.io/name: vaultwarden-database-owner
    app.kubernetes.io/component: database-credentials
    app.kubernetes.io/part-of: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: vaultwarden-database-owner
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: apps-vaultwarden/runtime
        property: database-username
    - secretKey: password
      remoteRef:
        key: apps-vaultwarden/runtime
        property: database-password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: vaultwarden
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: vaultwarden
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultwarden
          image: ${VAULTWARDEN_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - /vaultwarden
          env:
            - name: DOMAIN
              value: https://vaultwarden.${CONFIG_DOMAIN}
            - name: ROCKET_ADDRESS
              value: 0.0.0.0
            - name: ROCKET_PORT
              value: "8080"
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "false"
            - name: ADMIN_TOKEN
              value: ""
          envFrom:
            - secretRef:
                name: vaultwarden-runtime
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: vaultwarden
spec:
  selector:
    app.kubernetes.io/name: vaultwarden
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/component: internal-route
    app.kubernetes.io/part-of: vaultwarden
spec:
  parentRefs:
    - name: internal
      namespace: gateways
      sectionName: https
  hostnames:
    - vaultwarden.${CONFIG_DOMAIN}
  rules:
    - backendRefs:
        - name: vaultwarden
          port: 8080
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - authorize-openbao-authentication.yaml
  - materialize-runtime-secrets.yaml
  - deploy-vaultwarden-database.yaml
  - archive-vaultwarden-database.yaml
  - schedule-vaultwarden-database-backups.yaml
  - deploy-vaultwarden.yaml
  - expose-vaultwarden.yaml
  - preserve-vaultwarden-availability.yaml
  - monitor-vaultwarden.yaml
  - restrict-vaultwarden-network.yaml
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-runtime
  labels:
    app.kubernetes.io/name: vaultwarden-runtime
    app.kubernetes.io/component: runtime-credentials
    app.kubernetes.io/part-of: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: vaultwarden-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        username: '{{ .username }}'
        password: '{{ .password }}'
        DATABASE_URL: postgresql://{{ .username }}:{{ .password }}@vaultwarden-database-rw:5432/vaultwarden?sslmode=require
  data:
    - secretKey: username
      remoteRef:
        key: apps-vaultwarden/runtime
        property: database-username
    - secretKey: password
      remoteRef:
        key: apps-vaultwarden/runtime
        property: database-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-s3-credentials
  labels:
    app.kubernetes.io/name: vaultwarden-s3-credentials
    app.kubernetes.io/component: backup-credentials
    app.kubernetes.io/part-of: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: vaultwarden-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: apps-vaultwarden/s3
        property: access-key-id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: apps-vaultwarden/s3
        property: secret-access-key
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/component: alerting
    app.kubernetes.io/part-of: vaultwarden
spec:
  groups:
    - name: vaultwarden.rules
      rules:
        - alert: VaultwardenUnavailable
          expr: kube_deployment_status_replicas_available{namespace="apps-vaultwarden",deployment="vaultwarden"} < 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Vaultwarden is unavailable
            runbook_url: https://gitlab.${CONFIG_DOMAIN}/${CONFIG_GITLAB_PROJECT_PATH}/-/blob/main/docs/runbooks/operate-self-hosted-apps.md
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/component: availability
    app.kubernetes.io/part-of: vaultwarden
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: vaultwarden
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateways
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: vaultwarden-database
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vaultwarden-database
  labels:
    app.kubernetes.io/name: vaultwarden-database
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: vaultwarden
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: vaultwarden-database
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vaultwarden
        - podSelector:
            matchLabels:
              cnpg.io/cluster: vaultwarden-database
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9187
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: vaultwarden-database
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: daily-vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden-database
    app.kubernetes.io/component: database-backup
    app.kubernetes.io/part-of: vaultwarden
spec:
  schedule: 0 0 4 * * *
  backupOwnerReference: self
  immediate: false
  cluster:
    name: vaultwarden-database
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps-vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: homelab-applications
    policy.homelab.dev/profile: application
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps-vaultwarden
resources:
  - create-vaultwarden-namespace.yaml
  - ../../base
