---
# Dashboard JSON is intentionally stored as compact scalar values.
# yamllint disable rule:line-length
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-platform-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: homelab-platform-dashboards
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/part-of: observability
    grafana_dashboard: '1'
data:
  cluster.json: |-
    {"annotations":{"list":[]},"panels":[{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":0},"id":1,"targets":[{"expr":"sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})","refId":"A"}],"title":"Ready nodes","type":"stat"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":0},"id":2,"targets":[{"expr":"sum(kube_pod_status_phase{phase=\"Running\"})","refId":"A"}],"title":"Running pods","type":"stat"}],"refresh":"30s","schemaVersion":42,"tags":["homelab","cluster"],"time":{"from":"now-6h","to":"now"},"title":"Homelab / Cluster","uid":"homelab-cluster","version":1}
  nodes.json: |-
    {"annotations":{"list":[]},"panels":[{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"percentunit"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":0},"id":1,"targets":[{"expr":"1 - avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))","legendFormat":"{{instance}}","refId":"A"}],"title":"CPU utilization","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"percentunit"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":0},"id":2,"targets":[{"expr":"1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay\"}","legendFormat":"{{instance}} {{mountpoint}}","refId":"A"}],"title":"Filesystem utilization","type":"timeseries"}],"refresh":"30s","schemaVersion":42,"tags":["homelab","node"],"time":{"from":"now-6h","to":"now"},"title":"Homelab / Nodes","uid":"homelab-nodes","version":1}
  cilium.json: |-
    {"annotations":{"list":[]},"panels":[{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":0},"id":1,"targets":[{"expr":"sum(rate(hubble_flows_processed_total[5m])) by (type)","legendFormat":"{{type}}","refId":"A"}],"title":"Hubble flows","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":0},"id":2,"targets":[{"expr":"sum(rate(hubble_drop_total[5m])) by (reason)","legendFormat":"{{reason}}","refId":"A"}],"title":"Dropped flows","type":"timeseries"}],"refresh":"30s","schemaVersion":42,"tags":["homelab","cilium"],"time":{"from":"now-6h","to":"now"},"title":"Homelab / Cilium and Hubble","uid":"homelab-cilium","version":1}
  argocd.json: |-
    {"annotations":{"list":[]},"panels":[{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":0},"id":1,"targets":[{"expr":"sum(argocd_app_info{health_status=\"Healthy\"})","refId":"A"}],"title":"Healthy applications","type":"stat"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":0},"id":2,"targets":[{"expr":"sum(argocd_app_info{sync_status!=\"Synced\"})","refId":"A"}],"title":"Out-of-sync applications","type":"stat"}],"refresh":"30s","schemaVersion":42,"tags":["homelab","argocd"],"time":{"from":"now-6h","to":"now"},"title":"Homelab / Argo CD","uid":"homelab-argocd","version":1}
  longhorn.json: |-
    {"annotations":{"list":[]},"panels":[{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":0},"id":1,"targets":[{"expr":"count(longhorn_volume_state)","refId":"A"}],"title":"Volumes","type":"stat"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"bytes"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":0},"id":2,"targets":[{"expr":"sum(longhorn_volume_actual_size_bytes) by (volume)","legendFormat":"{{volume}}","refId":"A"}],"title":"Actual volume size","type":"timeseries"}],"refresh":"30s","schemaVersion":42,"tags":["homelab","longhorn"],"time":{"from":"now-6h","to":"now"},"title":"Homelab / Longhorn","uid":"homelab-longhorn","version":1}
  postgres.json: |-
    {"annotations":{"list":[]},"panels":[{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":0},"id":1,"targets":[{"expr":"cnpg_collector_up","legendFormat":"{{namespace}}/{{pod}}","refId":"A"}],"title":"CNPG collector health","type":"timeseries"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"bytes"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":0},"id":2,"targets":[{"expr":"cnpg_pg_database_size_bytes","legendFormat":"{{datname}}","refId":"A"}],"title":"Database size","type":"timeseries"}],"refresh":"30s","schemaVersion":42,"tags":["homelab","postgres"],"time":{"from":"now-6h","to":"now"},"title":"Homelab / PostgreSQL","uid":"homelab-postgres","version":1}
  etcd.json: |-
    {"annotations":{"list":[]},"panels":[{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":0},"id":1,"targets":[{"expr":"sum(etcd_server_has_leader)","refId":"A"}],"title":"Members with leader","type":"stat"},{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":0},"id":2,"targets":[{"expr":"increase(etcd_server_leader_changes_seen_total[1h])","legendFormat":"{{instance}}","refId":"A"}],"title":"Leader changes","type":"timeseries"}],"refresh":"30s","schemaVersion":42,"tags":["homelab","etcd"],"time":{"from":"now-6h","to":"now"},"title":"Homelab / etcd","uid":"homelab-etcd","version":1}
