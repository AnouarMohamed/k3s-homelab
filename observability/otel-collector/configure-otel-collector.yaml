mode: deployment
replicaCount: 2
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
  tag: 0.161.0
  digest: sha256:2fed8ff024bdb42473890724fa0833bd31e16197aa4790d8e0be3829f87f0de1
command:
  name: otelcol-k8s
config:
  extensions:
    health_check:
      endpoint: $${env:MY_POD_IP}:13133
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: $${env:MY_POD_IP}:4317
        http:
          endpoint: $${env:MY_POD_IP}:4318
  processors:
    batch: {}
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 20
    resource:
      attributes:
        - key: k8s.cluster.name
          value: homelab
          action: upsert
  exporters:
    otlp/tempo:
      endpoint: tempo.monitoring.svc:4317
      tls:
        insecure: true
  service:
    extensions:
      - health_check
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - resource
          - batch
        exporters:
          - otlp/tempo
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: $${env:MY_POD_IP}
                  port: 8888
ports:
  health:
    enabled: true
    containerPort: 13133
    servicePort: 13133
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-grpc:
    enabled: false
  jaeger-thrift:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
podDisruptionBudget:
  enabled: true
  minAvailable: 1
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: otel-collector
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: opentelemetry-collector
            app.kubernetes.io/instance: otel-collector
        topologyKey: kubernetes.io/hostname
serviceMonitor:
  enabled: true
  extraLabels:
    release: monitoring
networkPolicy:
  enabled: true
  allowIngressFrom:
    - namespaceSelector: {}
