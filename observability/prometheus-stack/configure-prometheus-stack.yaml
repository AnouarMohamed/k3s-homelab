---
defaultRules:
  disabled:
    Watchdog: true
  rules:
    kubeProxy: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  image:
    tag: v0.94.1
    sha: 7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a
  prometheusConfigReloader:
    image:
      tag: v0.94.1
      sha: 06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b
    enableProbe: true
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
  admissionWebhooks:
    patch:
      image:
        tag: 1.8.9
        sha: 58e4ac2e15bf7785eb00ac90d03f9be1ff3f2fe0add6c71b54af6e5c80031148
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  prometheusSpec:
    replicas: 2
    retention: 15d
    retentionSize: 18GB
    image:
      tag: v3.15.0-distroless
      sha: b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    enableFeatures:
      - exemplar-storage
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: '2'
        memory: 2Gi
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 2000
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus

alertmanager:
  alertmanagerSpec:
    replicas: 3
    image:
      tag: v0.34.1
      sha: e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector: {}
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 2000
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

grafana:
  replicas: 1
  deploymentStrategy:
    type: Recreate
  envFromSecret: grafana-admin
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  image:
    tag: 13.2.3-distroless
    sha: 202e5d5b3f8499e70ccac7991eea6d7da72d2790eb2e0597e7987acf724e7180
  sidecar:
    image:
      tag: 2.14.1
      sha: 092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: false
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8084
      initialDelaySeconds: 5
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8084
      initialDelaySeconds: 10
      periodSeconds: 20
  testFramework:
    enabled: false
  initChownData:
    enabled: false
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
  grafana.ini:
    analytics:
      reporting_enabled: false
      check_for_updates: false
    plugins:
      preinstall_disabled: true
      preinstall_auto_update: false
    security:
      disable_gravatar: true
    server:
      root_url: https://grafana.${CONFIG_DOMAIN}
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      scopes: openid profile email groups
      auth_url: https://keycloak.${CONFIG_DOMAIN}/realms/homelab/protocol/openid-connect/auth
      token_url: https://keycloak.${CONFIG_DOMAIN}/realms/homelab/protocol/openid-connect/token
      api_url: https://keycloak.${CONFIG_DOMAIN}/realms/homelab/protocol/openid-connect/userinfo
      role_attribute_path: >-
        contains(groups[*], 'homelab-admins') && 'Admin' ||
        contains(groups[*], 'homelab-viewers') && 'Viewer' || 'Viewer'
      allow_assign_grafana_admin: true
    users:
      allow_sign_up: false
  additionalDataSources:
    - name: Prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      isDefault: true
      url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
      jsonData:
        derivedFields:
          - name: TraceID
            matcherRegex: 'trace_id=(\w+)'
            datasourceUid: tempo
            url: '$${__value.raw}'
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc:3100
      jsonData:
        tracesToLogsV2:
          datasourceUid: Loki

kube-state-metrics:
  image:
    tag: v2.20.0
    sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

prometheus-node-exporter:
  image:
    tag: v1.12.1
    distroless: true
    digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
