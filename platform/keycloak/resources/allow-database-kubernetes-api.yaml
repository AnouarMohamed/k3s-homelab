---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-database-kubernetes-api
  labels:
    app.kubernetes.io/name: keycloak-database
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: homelab-platform
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: keycloak-database
  egress:
    - toEntities:
        - kube-apiserver
