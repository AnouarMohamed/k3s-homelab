---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    'app.kubernetes.io/name': keycloak
    'app.kubernetes.io/component': identity
    'app.kubernetes.io/part-of': homelab-platform
spec:
  selector: {'app.kubernetes.io/name': keycloak}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: management, port: 9000, targetPort: management}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  labels:
    'app.kubernetes.io/name': keycloak
    'app.kubernetes.io/component': internal-route
    'app.kubernetes.io/part-of': homelab-platform
spec:
  parentRefs:
    - {name: internal, namespace: gateways, sectionName: https}
  hostnames: ['keycloak.${CONFIG_DOMAIN}']
  rules:
    - backendRefs:
        - {name: keycloak, port: 8080}
