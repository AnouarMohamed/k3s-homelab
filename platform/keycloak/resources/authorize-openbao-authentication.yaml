---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-auth
  labels:
    app.kubernetes.io/name: keycloak-openbao-auth
    app.kubernetes.io/component: authentication
    app.kubernetes.io/part-of: homelab-platform
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mint-openbao-auth-token
  labels:
    app.kubernetes.io/name: keycloak-openbao-auth
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: homelab-platform
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - openbao-auth
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-external-secrets-to-mint-openbao-token
  labels:
    app.kubernetes.io/name: keycloak-openbao-auth
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: homelab-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mint-openbao-auth-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  labels:
    app.kubernetes.io/name: keycloak-openbao-store
    app.kubernetes.io/component: secret-store
    app.kubernetes.io/part-of: homelab-platform
spec:
  provider:
    vault:
      server: https://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: openbao-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: runtime-keycloak
          serviceAccountRef:
            name: openbao-auth
            audiences:
              - openbao
