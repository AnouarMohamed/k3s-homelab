---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-runtime
  labels:
    'app.kubernetes.io/name': keycloak-runtime
    'app.kubernetes.io/component': runtime-credentials
    'app.kubernetes.io/part-of': homelab-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: keycloak-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        KC_DB_USERNAME: '{{ .databaseUsername }}'
        KC_DB_PASSWORD: '{{ .databasePassword }}'
        KC_BOOTSTRAP_ADMIN_USERNAME: '{{ .administratorUsername }}'
        KC_BOOTSTRAP_ADMIN_PASSWORD: '{{ .administratorPassword }}'
        ARGOCD_CLIENT_SECRET: '{{ .argocdClientSecret }}'
        GRAFANA_CLIENT_SECRET: '{{ .grafanaClientSecret }}'
  data:
    - secretKey: databaseUsername
      remoteRef: {key: keycloak/runtime, property: database-username}
    - secretKey: databasePassword
      remoteRef: {key: keycloak/runtime, property: database-password}
    - secretKey: administratorUsername
      remoteRef: {key: keycloak/runtime, property: administrator-username}
    - secretKey: administratorPassword
      remoteRef: {key: keycloak/runtime, property: administrator-password}
    - secretKey: argocdClientSecret
      remoteRef: {key: keycloak/runtime, property: argocd-client-secret}
    - secretKey: grafanaClientSecret
      remoteRef: {key: keycloak/runtime, property: grafana-client-secret}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-s3-credentials
  labels:
    'app.kubernetes.io/name': keycloak-s3-credentials
    'app.kubernetes.io/component': backup-credentials
    'app.kubernetes.io/part-of': homelab-platform
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: keycloak-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: keycloak/s3, property: access-key-id}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: keycloak/s3, property: secret-access-key}
