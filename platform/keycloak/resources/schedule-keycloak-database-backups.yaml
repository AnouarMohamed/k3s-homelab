---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: daily-keycloak
  labels:
    'app.kubernetes.io/name': keycloak-database
    'app.kubernetes.io/component': database-backup
    'app.kubernetes.io/part-of': homelab-platform
spec:
  schedule: 0 15 3 * * *
  backupOwnerReference: self
  immediate: false
  cluster: {name: keycloak-database}
  method: plugin
  pluginConfiguration: {name: barman-cloud.cloudnative-pg.io}
