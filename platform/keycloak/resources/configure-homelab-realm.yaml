---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-homelab-realm
  labels:
    'app.kubernetes.io/name': keycloak
    'app.kubernetes.io/component': realm-configuration
    'app.kubernetes.io/part-of': homelab-platform
data:
  homelab-realm.json: |
    {
      "realm": "homelab",
      "enabled": true,
      "displayName": "Anouar's Homelab",
      "sslRequired": "external",
      "registrationAllowed": false,
      "resetPasswordAllowed": true,
      "rememberMe": true,
      "bruteForceProtected": true,
      "groups": [
        {"name": "homelab-admins"},
        {"name": "homelab-viewers"}
      ],
      "requiredActions": [
        {
          "alias": "CONFIGURE_TOTP",
          "name": "Configure OTP",
          "providerId": "CONFIGURE_TOTP",
          "enabled": true,
          "defaultAction": true,
          "priority": 10
        }
      ],
      "clients": [
        {
          "clientId": "argocd",
          "name": "Argo CD",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "${ARGOCD_CLIENT_SECRET}",
          "redirectUris": ["https://argocd.${CONFIG_DOMAIN}/auth/callback"],
          "webOrigins": ["https://argocd.${CONFIG_DOMAIN}"],
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "publicClient": false,
          "protocol": "openid-connect",
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "full.path": "false",
                "claim.name": "groups",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "grafana",
          "name": "Grafana",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "${GRAFANA_CLIENT_SECRET}",
          "redirectUris": ["https://grafana.${CONFIG_DOMAIN}/login/generic_oauth"],
          "webOrigins": ["https://grafana.${CONFIG_DOMAIN}"],
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "publicClient": false,
          "protocol": "openid-connect",
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "full.path": "false",
                "claim.name": "groups",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        }
      ]
    }
