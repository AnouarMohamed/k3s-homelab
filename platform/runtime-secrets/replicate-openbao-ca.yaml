---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-ca-reader
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-ca-reader
    app.kubernetes.io/component: trust-distribution
    app.kubernetes.io/part-of: runtime-secrets
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mint-openbao-ca-reader-token
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-ca-reader
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: runtime-secrets
rules:
  - apiGroups:
      - ''
    resources:
      - serviceaccounts/token
    resourceNames:
      - openbao-ca-reader
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-external-secrets-to-mint-openbao-ca-token
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-ca-reader
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: runtime-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mint-openbao-ca-reader-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-openbao-ca
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-ca-reader
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: runtime-secrets
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    resourceNames:
      - openbao-server-tls
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-openbao-ca-read
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-ca-reader
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: runtime-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-openbao-ca
subjects:
  - kind: ServiceAccount
    name: openbao-ca-reader
    namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: review-openbao-ca-reader-permissions
  labels:
    app.kubernetes.io/name: openbao-ca-reader
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: runtime-secrets
rules:
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: allow-openbao-ca-reader-review
  labels:
    app.kubernetes.io/name: openbao-ca-reader
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: runtime-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: review-openbao-ca-reader-permissions
subjects:
  - kind: ServiceAccount
    name: openbao-ca-reader
    namespace: openbao
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-ca-source
  labels:
    app.kubernetes.io/name: openbao-ca-source
    app.kubernetes.io/component: trust-distribution
    app.kubernetes.io/part-of: runtime-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: openbao
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: openbao
          key: ca.crt
      auth:
        serviceAccount:
          name: openbao-ca-reader
          namespace: openbao
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: replicate-openbao-ca
  labels:
    app.kubernetes.io/name: openbao-ca
    app.kubernetes.io/component: trust-distribution
    app.kubernetes.io/part-of: runtime-secrets
spec:
  externalSecretName: openbao-ca
  namespaceSelectors:
    - matchLabels:
        runtime-secrets.homelab.dev/openbao-ca: "true"
  refreshTime: 1h
  externalSecretMetadata:
    labels:
      app.kubernetes.io/name: openbao-ca
      app.kubernetes.io/component: trust-distribution
      app.kubernetes.io/part-of: runtime-secrets
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: openbao-ca-source
    target:
      name: openbao-ca
      creationPolicy: Owner
      deletionPolicy: Retain
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-ca
            app.kubernetes.io/component: trust-distribution
            app.kubernetes.io/part-of: runtime-secrets
    data:
      - secretKey: ca.crt
        remoteRef:
          key: openbao-server-tls
          property: ca.crt
