---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gateways
  labels:
    app.kubernetes.io/name: public-gateway
    app.kubernetes.io/component: edge-routing
    app.kubernetes.io/part-of: edge-access
spec:
  gatewayClassName: cilium
  listeners:
    - name: tunnel-http
      protocol: HTTP
      port: 80
      hostname: '*.${CONFIG_DOMAIN}'
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.anouar.dev/public-gateway-access: 'true'
    - name: https
      protocol: HTTPS
      port: 443
      hostname: '*.${CONFIG_DOMAIN}'
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: edge-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.anouar.dev/public-gateway-access: 'true'
