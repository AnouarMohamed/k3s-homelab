---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream/define-volume-snapshotclasses.yaml
  - upstream/define-volume-snapshots.yaml
  - upstream/define-volume-snapshotcontents.yaml
  - upstream/authorize-snapshot-controller.yaml
  - upstream/deploy-snapshot-controller.yaml
  - restrict-snapshot-controller-network.yaml
patches:
  - path: harden-snapshot-controller.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: snapshot-controller
