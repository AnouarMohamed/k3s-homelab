---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openbao
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: openbao-runtime-configuration
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: runtime-secrets
configMapGenerator:
  - name: openbao-runtime-configuration
    files:
      - apply-openbao-configuration.sh
      - operator-write.hcl
      - policy-argocd.hcl=policies/argocd.hcl
      - policy-cert-manager.hcl=policies/cert-manager.hcl
      - policy-cloudflared.hcl=policies/cloudflared.hcl
      - policy-external-dns.hcl=policies/external-dns.hcl
      - policy-external-secrets.hcl=policies/external-secrets.hcl
      - policy-longhorn-system.hcl=policies/longhorn-system.hcl
      - policy-monitoring.hcl=policies/monitoring.hcl
      - policy-storage-verification.hcl=policies/storage-verification.hcl
      - policy-velero.hcl=policies/velero.hcl
