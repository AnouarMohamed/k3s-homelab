---
clusterScoped: true
timezone: ${CONFIG_TIMEZONE}
enableProfiling: false
images:
  registry: ghcr.io
  tag: v2.8.4
controllerManager:
  replicaCount: 3
  enableFilterNamespace: true
  allowHostNetworkTesting: false
  chaosdSecurityMode: false
  imagePullPolicy: IfNotPresent
  podChaos:
    podFailure:
      pauseImage: registry.k8s.io/pause:3.10.1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: controller-manager
chaosDaemon:
  runtime: containerd
  socketPath: /run/k3s/containerd/containerd.sock
  privileged: true
  imagePullPolicy: IfNotPresent
  mtls:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
dashboard:
  create: false
dnsServer:
  create: false
prometheus:
  create: false
bpfki:
  create: false
webhook:
  certManager:
    enabled: true
