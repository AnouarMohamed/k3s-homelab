---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab-lan
spec:
  interfaces:
    - ${CONFIG_NODE_INTERFACE_PATTERN}
  loadBalancerIPs: true
  externalIPs: false
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  serviceSelector: {}
...
