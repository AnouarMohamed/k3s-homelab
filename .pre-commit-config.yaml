---
repos:
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types:
          - yaml
      - id: markdownlint
        name: markdownlint
        entry: markdownlint-cli2
        language: system
        types:
          - markdown
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types:
          - shell
      - id: ansible-lint
        name: ansible-lint
        entry: ansible-lint
        language: system
        files: ^infra/ansible/
        pass_filenames: false
        args:
          - infra/ansible
      - id: kubeconform
        name: kubeconform
        entry: scripts/validate-manifests.sh
        language: script
        files: ^(apps|clusters|observability|platform|policies)/.*\.ya?ml$
        pass_filenames: false
      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
      - id: forbidden-files
        name: forbidden public files
        entry: scripts/check-forbidden-files.sh
        language: script
        pass_filenames: false
      - id: private-values
        name: private values outside central config
        entry: scripts/check-private-values.sh
        language: script
        pass_filenames: false
      - id: dependency-pins
        name: dependency pin policy
        entry: scripts/check-pins.sh
        language: script
        pass_filenames: false
...
