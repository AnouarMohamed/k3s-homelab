---
# Handlers for hardening role
- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted
  become: true

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  become: true

- name: Restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted
  become: true
...

