---
- name: Apply kernel parameters
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: Validate SSH configuration
  ansible.builtin.command: sshd -t
  changed_when: false
  listen: Restart SSH

- name: Restart SSH service
  ansible.builtin.service:
    name: ssh
    state: restarted
  listen: Restart SSH
