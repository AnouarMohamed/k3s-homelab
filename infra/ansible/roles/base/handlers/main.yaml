---
- name: Apply kernel parameters
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: Create the volatile OpenSSH privilege-separation directory
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  listen: Restart SSH

- name: Validate SSH configuration
  ansible.builtin.command: sshd -t
  changed_when: false
  listen: Restart SSH

- name: Restart SSH service
  ansible.builtin.service:
    name: ssh
    state: restarted
  listen: Restart SSH
