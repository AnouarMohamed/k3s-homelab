---
- name: Read installed k3s version
  ansible.builtin.command: k3s --version
  register: installed_k3s_version
  changed_when: false

- name: Upgrade node when the pinned version differs
  when: k3s_version not in installed_k3s_version.stdout
  block:
    - name: Drain node before replacing k3s
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - drain
          - "{{ inventory_hostname }}"
          - --ignore-daemonsets
          - --delete-emptydir-data
          - --timeout=10m
      delegate_to: "{{ groups.initial_server[0] }}"
      register: drain_result
      changed_when: drain_result.rc == 0

    - name: Apply pinned k3s role
      ansible.builtin.include_role:
        name: k3s

    - name: Flush k3s restart after binary replacement
      ansible.builtin.meta: flush_handlers

    - name: Verify upgraded k3s version
      ansible.builtin.command: k3s --version
      register: upgraded_k3s_version
      changed_when: false
      failed_when: k3s_version not in upgraded_k3s_version.stdout

    - name: Wait for upgraded node readiness
      ansible.builtin.command: >-
        k3s kubectl wait --for=condition=Ready
        node/{{ inventory_hostname }} --timeout=10m
      delegate_to: "{{ groups.initial_server[0] }}"
      changed_when: false

    - name: Wait for local etcd readiness
      ansible.builtin.command: k3s kubectl get --raw=/readyz/etcd
      delegate_to: "{{ groups.initial_server[0] }}"
      register: etcd_readiness
      changed_when: false
      until: etcd_readiness.stdout | trim == 'ok'
      retries: 60
      delay: 10

    - name: Wait for Longhorn volume health
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          k3s kubectl -n longhorn-system get volumes.longhorn.io
          -o jsonpath='{range .items[*]}{.status.robustness}{"\n"}{end}' |
          grep -cv '^healthy$' || true
        executable: /bin/bash
      delegate_to: "{{ groups.initial_server[0] }}"
      register: unhealthy_longhorn_volumes
      changed_when: false
      until: unhealthy_longhorn_volumes.stdout | int == 0
      retries: 60
      delay: 10

  always:
    - name: Uncordon node after upgrade attempt
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - uncordon
          - "{{ inventory_hostname }}"
      delegate_to: "{{ groups.initial_server[0] }}"
      register: uncordon_result
      changed_when: "'uncordoned' in uncordon_result.stdout"
      when: drain_result is defined and drain_result.rc == 0
...
