---
- name: Prepare and harden every homelab node
  hosts: k3s_cluster
  become: true
  gather_facts: true
  roles:
    - role: base
    - role: hardening

- name: Initialize the first k3s server
  hosts: initial_server
  become: true
  gather_facts: true
  roles:
    - role: k3s
    - role: kube_vip
      when: homelab_enable_kube_vip | default(true) | bool

- name: Wait for the control-plane virtual address
  hosts: initial_server
  gather_facts: false
  become: false
  tasks:
    - name: Wait for the shared API endpoint before any server joins
      ansible.builtin.wait_for:
        host: "{{ homelab_control_plane_endpoint | default(homelab_spec.network.controlPlaneVip) }}"
        port: 6443
        connect_timeout: 3
        sleep: 5
        timeout: 300

- name: Join remaining k3s servers through the VIP
  hosts: joining_servers
  serial: 1
  become: true
  gather_facts: true
  roles:
    - role: k3s
    - role: kube_vip
      when: homelab_enable_kube_vip | default(true) | bool
...
