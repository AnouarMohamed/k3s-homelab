---
- name: Prepare and harden every homelab node
  hosts: k3s_cluster
  become: true
  gather_facts: true
  roles:
    - role: base
    - role: hardening

- name: Initialize the first k3s server
  hosts: initial_server
  become: true
  gather_facts: true
  roles:
    - role: k3s
    - role: kube_vip

- name: Wait for the control-plane virtual address
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    homelab_config_path: "{{ playbook_dir }}/../../config/homelab.yaml"
    homelab_config: "{{ lookup('ansible.builtin.file', homelab_config_path) | from_yaml }}"
  tasks:
    - name: Wait for the VIP API endpoint before any server joins
      ansible.builtin.wait_for:
        host: "{{ homelab_config.spec.network.controlPlaneVip }}"
        port: 6443
        connect_timeout: 3
        sleep: 5
        timeout: 300

- name: Join remaining k3s servers through the VIP
  hosts: joining_servers
  serial: 1
  become: true
  gather_facts: true
  roles:
    - role: k3s
    - role: kube_vip
...
