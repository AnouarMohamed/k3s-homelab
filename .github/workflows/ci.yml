---
name: CI & Policy Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Test & Validate Repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26'
          check-latest: false

      - name: Run Sentinel Unit Tests & Lint
        run: |
          make test

      - name: Check Dependency Pins
        run: |
          scripts/check-pins.sh

      - name: Check Forbidden Files
        run: |
          scripts/check-forbidden-files.sh

      - name: Check Private Values
        run: |
          scripts/check-private-values.sh

  security-gitleaks:
    name: Secret Leak Detection
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          scripts/tool-versions.env
          source scripts/tool-versions.env
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks

      - name: Scan Repository for Secrets
        run: |
          gitleaks dir --redact --verbose .
          gitleaks git --redact --verbose --log-opts="--all"
...

