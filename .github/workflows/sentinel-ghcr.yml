---
name: Sentinel GHCR Delivery

on:
  push:
    branches:
      - main
    paths:
      - apps/sentinel/**
      - .github/workflows/sentinel-ghcr.yml
  pull_request:
    branches:
      - main
    paths:
      - apps/sentinel/**
      - .github/workflows/sentinel-ghcr.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  build-scan-sign:
    name: Build, Scan, Attest, and Sign (GHCR)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Install Supply Chain Tools (Cosign, Syft, Trivy)
        run: |
          source ci/dependencies.env
          curl -sSL -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          curl -sSL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin syft
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sudo tar -xz -C /usr/local/bin trivy

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Target Image Tags
        id: meta
        run: |
          owner_lower=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          commit_sha="${{ github.sha }}"
          short_sha="${commit_sha:0:8}"
          echo "api_image=${{ env.REGISTRY }}/${owner_lower}/homelab-sentinel-api:${short_sha}" >> "$GITHUB_OUTPUT"
          echo "worker_image=${{ env.REGISTRY }}/${owner_lower}/homelab-sentinel-worker:${short_sha}" >> "$GITHUB_OUTPUT"
          is_push="false"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            is_push="true"
          fi
          echo "push_image=${is_push}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Sentinel API
        id: build_api
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: apps/sentinel
          file: apps/sentinel/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push_image == 'true' }}
          tags: ${{ steps.meta.outputs.api_image }}

      - name: Build & Push Sentinel Worker
        id: build_worker
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: apps/sentinel
          file: apps/sentinel/Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push_image == 'true' }}
          tags: ${{ steps.meta.outputs.worker_image }}

      - name: Generate SBOM (Sentinel API)
        if: steps.meta.outputs.push_image == 'true'
        run: |
          api_ref="${{ steps.meta.outputs.api_image }}@${{ steps.build_api.outputs.digest }}"
          syft "${api_ref}" -o spdx-json=api-sbom.spdx.json

      - name: Generate SBOM (Sentinel Worker)
        if: steps.meta.outputs.push_image == 'true'
        run: |
          worker_ref="${{ steps.meta.outputs.worker_image }}@${{ steps.build_worker.outputs.digest }}"
          syft "${worker_ref}" -o spdx-json=worker-sbom.spdx.json

      - name: Vulnerability Scan (Sentinel API)
        if: steps.meta.outputs.push_image == 'true'
        run: |
          trivy image --exit-code 1 --severity CRITICAL,HIGH "${{ steps.meta.outputs.api_image }}@${{ steps.build_api.outputs.digest }}"

      - name: Vulnerability Scan (Sentinel Worker)
        if: steps.meta.outputs.push_image == 'true'
        run: |
          trivy image --exit-code 1 --severity CRITICAL,HIGH "${{ steps.meta.outputs.worker_image }}@${{ steps.build_worker.outputs.digest }}"

      - name: Cosign Sign & Attest (Keyless OIDC)
        if: steps.meta.outputs.push_image == 'true'
        run: |
          api_ref="${{ steps.meta.outputs.api_image }}@${{ steps.build_api.outputs.digest }}"
          worker_ref="${{ steps.meta.outputs.worker_image }}@${{ steps.build_worker.outputs.digest }}"
          cosign sign --yes "${api_ref}"
          cosign attest --yes --predicate api-sbom.spdx.json --type spdx "${api_ref}"
          cosign sign --yes "${worker_ref}"
          cosign attest --yes --predicate worker-sbom.spdx.json --type spdx "${worker_ref}"
...
