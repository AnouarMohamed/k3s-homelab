---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-root
  namespace: argocd
  labels:
    app.kubernetes.io/name: homelab-root
    app.kubernetes.io/component: app-of-apps
    app.kubernetes.io/part-of: homelab-platform
spec:
  project: gitops
  source:
    repoURL: ${CONFIG_GITLAB_REPOSITORY_URL}
    targetRevision: main
    path: clusters/homelab/bootstrap
    plugin:
      name: homelab-renderer-v1
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=false
      - PruneLast=true
      - ServerSideApply=true
  revisionHistoryLimit: 10
