apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-gitops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # This should point to your GitLab repository
    # The actual URL will be in the SOPS-encrypted secret above
    repo: https://gitlab.com/your-username/your-repo.git
    targetRevision: main
    path: clusters/homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true