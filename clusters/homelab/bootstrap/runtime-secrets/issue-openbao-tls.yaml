---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-bootstrap-self-signed
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-tls
    app.kubernetes.io/component: certificate
    app.kubernetes.io/part-of: runtime-secrets
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-root-ca
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-tls
    app.kubernetes.io/component: certificate
    app.kubernetes.io/part-of: runtime-secrets
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  isCA: true
  commonName: OpenBao Homelab Root CA
  secretName: openbao-root-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: openbao-bootstrap-self-signed
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-root-ca
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-tls
    app.kubernetes.io/component: certificate
    app.kubernetes.io/part-of: runtime-secrets
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  ca:
    secretName: openbao-root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-server
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-tls
    app.kubernetes.io/component: certificate
    app.kubernetes.io/part-of: runtime-secrets
spec:
  secretName: openbao-server-tls
  duration: 2160h
  renewBefore: 360h
  commonName: openbao.openbao.svc
  dnsNames:
    - openbao
    - openbao.openbao
    - openbao.openbao.svc
    - openbao-active
    - openbao-active.openbao
    - openbao-active.openbao.svc
    - openbao-standby
    - openbao-standby.openbao
    - openbao-standby.openbao.svc
    - openbao-internal
    - openbao-internal.openbao
    - openbao-internal.openbao.svc
    - '*.openbao-internal.openbao.svc'
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - client auth
  issuerRef:
    name: openbao-root-ca
    kind: Issuer
