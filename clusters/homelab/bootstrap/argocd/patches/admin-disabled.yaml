# Patch to disable the default admin account and configure RBAC
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  # Disable the default admin account
  accounts.admin: enabled=false
  # Configure session timeout (optional)
  accounts.sessiontimeout: 15m
  # Resource exclusions - ignore certain resources that Argo CD shouldn't manage
  resource.exclusions: |
    - apiGroups:
      - apiextensions.k8s.io
      kinds:
      - CustomResourceDefinition
      - CustomResource
    - apiGroups:
      - argoproj.io
      kinds:
      - Application
      - ApplicationSet
      - AppProject
    - apiGroups:
      - k8s.cni.cncf.io
      kinds:
      - NetworkAttachmentDefinition