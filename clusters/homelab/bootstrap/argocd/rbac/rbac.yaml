apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.csv: |
    # role assignments
    p, role:admin, applications, */*, */*, allow
    p, role:read-only, applications, */*, get, allow
    p, role:read-only, applications, */*/*, get, allow

    # role assignments for system:admin-like access
    g, admin_default, role:admin

    # Break-glass admin account (for emergency access)
    g, breakglass-admin, role:admin

    # Read-only group
    g, readonly_group, role:read-only
  policy.default: role:readonly