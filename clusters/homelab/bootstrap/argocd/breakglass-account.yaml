apiVersion: v1
kind: Secret
metadata:
  name: argocd-breakglass-admin
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-secret
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  # This is a bcrypt hash of a strong password that should be changed after first use
  # To generate: htpasswd -nbB admin <password> | cut -d: -f2
  # Example password: BreakGlassAdmin2026! (should be changed immediately after first login)
  password: $2a$12$FAKEBCRYPTHASHFORDEMOPURPOSESONLYXXXXXXXXXXXXXXXXXXXXXXXX
  username: breakglass-admin