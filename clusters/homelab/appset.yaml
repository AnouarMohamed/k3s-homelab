apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: homelab
            url: https://kubernetes.default.svc
  template:
    metadata:
      name: '{{cluster}}-{{path.basename}}'
    spec:
      project: apps
      source:
        repoURL: https://gitlab.com/your-username/your-repo.git
        targetRevision: main
        path: clusters/homelab/apps/{{path.basename}}
      destination:
        server: '{{url}}'
        namespace: '{{cluster}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true