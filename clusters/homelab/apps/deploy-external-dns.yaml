---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/component: dns-controller
    app.kubernetes.io/part-of: edge-access
  annotations:
    argocd.argoproj.io/sync-wave: '-28'
spec:
  project: edge
  source:
    repoURL: ${CONFIG_GITLAB_REPOSITORY_URL}
    targetRevision: main
    path: platform/external-dns
    plugin:
      name: homelab-renderer-v1
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - ServerSideApply=true
  revisionHistoryLimit: 10
