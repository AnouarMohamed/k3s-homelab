---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/component: staging-application
    app.kubernetes.io/part-of: homelab-sentinel
  annotations:
    argocd.argoproj.io/sync-wave: '19'
spec:
  project: applications
  source:
    repoURL: ${CONFIG_GITLAB_REPOSITORY_URL}
    targetRevision: main
    path: apps/sentinel/overlays/staging
    plugin:
      name: homelab-renderer-v1
  destination:
    server: https://kubernetes.default.svc
    namespace: apps-sentinel-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
  revisionHistoryLimit: 10
