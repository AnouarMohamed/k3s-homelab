apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  source:
    repoURL: https://helm.longhorn.io
    chart: longhorn
    targetRevision: v1.6.2
    helm:
      values: |
        defaultSettings:
          backupTarget: s3://backup@minio/
          backupTargetCredentialSecret: longhorn-backup-s3-credential
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true