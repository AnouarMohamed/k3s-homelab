---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runtime-secret-prerequisites
  namespace: argocd
  labels:
    app.kubernetes.io/name: runtime-secret-prerequisites
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: runtime-secrets
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  project: runtime-secrets
  source:
    repoURL: ${CONFIG_GITLAB_REPOSITORY_URL}
    targetRevision: main
    path: clusters/homelab/bootstrap/runtime-secrets
    plugin:
      name: homelab-renderer-v1
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - ServerSideApply=true
  revisionHistoryLimit: 10
