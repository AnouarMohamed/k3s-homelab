---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/name: bootstrap-secrets
    app.kubernetes.io/component: repository-credentials
    app.kubernetes.io/part-of: homelab-platform
  annotations:
    argocd.argoproj.io/sync-wave: '-49'
spec:
  project: gitops
  source:
    repoURL: ${CONFIG_GITLAB_REPOSITORY_URL}
    targetRevision: main
    path: clusters/homelab/bootstrap/repository-credentials
    plugin:
      name: homelab-renderer-v1
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=false
      - PruneLast=true
      - ServerSideApply=true
  revisionHistoryLimit: 10
