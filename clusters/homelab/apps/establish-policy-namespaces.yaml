---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy-namespaces
  namespace: argocd
  labels:
    app.kubernetes.io/name: policy-namespaces
    app.kubernetes.io/component: namespace-bootstrap
    app.kubernetes.io/part-of: homelab-security
  annotations:
    argocd.argoproj.io/sync-wave: '-13'
spec:
  project: policy
  source:
    repoURL: ${CONFIG_GITLAB_REPOSITORY_URL}
    targetRevision: main
    path: policies/bootstrap
    plugin:
      name: homelab-renderer-v1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
  revisionHistoryLimit: 10
