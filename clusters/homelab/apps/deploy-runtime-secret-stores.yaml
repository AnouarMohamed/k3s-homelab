---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runtime-secret-stores
  namespace: argocd
  labels:
    app.kubernetes.io/name: runtime-secret-stores
    app.kubernetes.io/component: secret-store
    app.kubernetes.io/part-of: runtime-secrets
  annotations:
    argocd.argoproj.io/sync-wave: '-17'
spec:
  project: runtime-secrets
  source:
    repoURL: ${CONFIG_GITLAB_REPOSITORY_URL}
    targetRevision: main
    path: platform/runtime-secrets
    plugin:
      name: homelab-renderer-v1
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - ServerSideApply=true
  revisionHistoryLimit: 10
