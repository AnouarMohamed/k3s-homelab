---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/name: edge-secrets
    app.kubernetes.io/component: secret-bootstrap
    app.kubernetes.io/part-of: edge-access
  annotations:
    argocd.argoproj.io/sync-wave: '-35'
spec:
  project: edge
  source:
    repoURL: ${CONFIG_GITLAB_REPOSITORY_URL}
    targetRevision: main
    path: clusters/homelab/bootstrap/edge-secrets
    plugin:
      name: homelab-renderer-v1
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - ServerSideApply=true
  revisionHistoryLimit: 10
