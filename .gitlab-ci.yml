---
stages:
  - lint
  - validate
  - test
  - build
  - security
  - sign
  - promote
  - mirror

include:
  - local: ci/sentinel.gitlab-ci.yml

default:
  interruptible: true

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  GOTOOLCHAIN: local

lint:yaml-and-ansible:
  stage: lint
  image: python:3.14.7-slim@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
  before_script:
    - python -m pip install ansible-lint==26.9.0 yamllint==1.38.0
    - ansible-galaxy collection install -r infra/ansible/collections/requirements.yaml
  script:
    - yamllint .
    - ansible-lint infra/ansible
    - ansible-inventory -i infra/ansible/inventory/homelab.py --graph
    - ansible-playbook -i infra/ansible/inventory/homelab.py infra/ansible/site.yaml --syntax-check
    - ansible-playbook -i infra/ansible/inventory/homelab.py infra/ansible/upgrade.yaml --syntax-check
    - ansible-playbook -i infra/ansible/inventory/homelab.py infra/ansible/reset.yaml --syntax-check
    - ansible-playbook -i infra/ansible/inventory/homelab.py infra/ansible/validate-templates.yaml

lint:markdown:
  stage: lint
  image:
    name: davidanson/markdownlint-cli2:v0.23.3@sha256:d5f3f3f04b2e285dcbcdcd13b4454d119e273e3c393a9dabd163dba4abad526d
    entrypoint:
      - ""
  script:
    - markdownlint-cli2

lint:shell:
  stage: lint
  image:
    name: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
    entrypoint:
      - ""
  script:
    - shellcheck scripts/*.sh

validate:repository:
  stage: validate
  image: golang:1.26.9-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c
  before_script:
    - source scripts/tool-versions.env
    - export GOBIN="${CI_PROJECT_DIR}/.tools/bin"
    - mkdir -p "${GOBIN}"
    - go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
    - go install golang.stackrox.io/kube-linter/cmd/kube-linter@v0.8.3
    - go install go.k6.io/k6@"${K6_VERSION}"
    - go install sigs.k8s.io/kustomize/kustomize/v5@"${KUSTOMIZE_VERSION}"
    - go install github.com/mikefarah/yq/v4@"${YQ_VERSION}"
    - go install helm.sh/helm/v3/cmd/helm@"${HELM_VERSION}"
    - go install github.com/getsops/sops/v3/cmd/sops@"${SOPS_VERSION}"
    - tofu_release="${TOFU_VERSION#v}"
    - tofu_url="https://github.com/opentofu/opentofu/releases/download/${TOFU_VERSION}"
    - |-
      curl --fail --location --silent --show-error --output /tmp/tofu.tgz \
      "${tofu_url}/tofu_${tofu_release}_linux_amd64.tar.gz"
    - |-
      curl --fail --location --silent --show-error --output /tmp/tofu-checksums.txt \
      "${tofu_url}/tofu_${tofu_release}_SHA256SUMS"
    - |-
      grep "  tofu_${tofu_release}_linux_amd64.tar.gz$" /tmp/tofu-checksums.txt |
      sed 's#tofu_.*_linux_amd64.tar.gz#/tmp/tofu.tgz#' |
      sha256sum --check --strict
    - tar --extract --gzip --file /tmp/tofu.tgz --directory "${GOBIN}" tofu
    - prometheus_archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
    - prometheus_directory="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
    - prometheus_url="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
    - |-
      curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
      --output "/tmp/${prometheus_archive}" \
      "${prometheus_url}/${prometheus_archive}"
    - |-
      curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
      --output /tmp/prometheus-sha256sums.txt \
      "${prometheus_url}/sha256sums.txt"
    - |-
      grep "  ${prometheus_archive}$" /tmp/prometheus-sha256sums.txt | \
      sed "s#${prometheus_archive}#/tmp/${prometheus_archive}#" | \
      sha256sum --check --strict
    - |-
      tar --extract --gzip --file "/tmp/${prometheus_archive}" --directory /tmp \
      "${prometheus_directory}/promtool"
    - install --mode 0755 "/tmp/${prometheus_directory}/promtool" "${GOBIN}/promtool"
    - kyverno_archive="kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
    - kyverno_url="https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}"
    - |-
      curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
      --output "/tmp/${kyverno_archive}" "${kyverno_url}/${kyverno_archive}"
    - |-
      curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
      --output /tmp/kyverno-checksums.txt "${kyverno_url}/checksums.txt"
    - |-
      grep "  ${kyverno_archive}$" /tmp/kyverno-checksums.txt | \
      sed "s#${kyverno_archive}#/tmp/${kyverno_archive}#" | \
      sha256sum --check --strict
    - tar --extract --gzip --file "/tmp/${kyverno_archive}" --directory /tmp kyverno
    - install --mode 0755 /tmp/kyverno "${GOBIN}/kyverno"
    - export PATH="${GOBIN}:${PATH}"
  script:
    - scripts/check-forbidden-files.sh
    - scripts/check-private-values.sh
    - scripts/check-pins.sh
    - scripts/validate-manifests.sh
    - scripts/validate-cilium.sh
    - scripts/validate-gitops.sh
    - scripts/validate-edge.sh
    - scripts/validate-storage.sh
    - scripts/validate-secrets.sh
    - scripts/validate-observability.sh
    - scripts/validate-policy.sh
    - scripts/validate-sentinel.sh
    - scripts/validate-ghcr-packages.sh

security:gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint:
      - ""
  script:
    - gitleaks dir --redact --verbose .
    - gitleaks git --redact --verbose --log-opts=--all
...
