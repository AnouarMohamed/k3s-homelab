---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-network-policy
  annotations:
    policies.kyverno.io/title: Require a matching NetworkPolicy
    policies.kyverno.io/category: Network isolation
    policies.kyverno.io/severity: high
    policies.kyverno.io/minversion: 1.6.0
spec:
  validationFailureAction: Audit
  background: false
  rules:
    - name: require-network-policy
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
              namespaces:
                - apps-*
      preconditions:
        all:
          - key: "{{ request.operation }}"
            operator: AnyIn
            value:
              - CREATE
              - UPDATE
      context:
        - name: matchingPolicies
          apiCall:
            urlPath: >-
              /apis/networking.k8s.io/v1/namespaces/{{ request.namespace }}/networkpolicies
            jmesPath: >-
              items[?label_match(spec.podSelector.matchLabels,
              `{{ request.object.spec.template.metadata.labels }}`)] | length(@)
      validate:
        message: Every application workload requires a matching NetworkPolicy.
        deny:
          conditions:
            all:
              - key: "{{ matchingPolicies }}"
                operator: LessThan
                value: 1
